[project]
name = "pydantic-httpx"
version = "0.3.1"
description = "Async HTTP client built on httpx + pydantic v2 with first-class Server-Sent Events support."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pylakey", email = "pylakey@protonmail.com" }]
requires-python = ">=3.11"
keywords = ["httpx", "pydantic", "sse", "server-sent-events", "async", "http-client", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "aiofiles>=25.1.0",
    "httpx>=0.28.1",
    "httpx-sse>=0.4.3",
    "pydantic>=2.7.0,<3",
    "pydantic-extra-types>=2.11.1",
    "ujson>=5.12.1",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
# Optional Brotli (`Content-Encoding: br`) support for httpx. Mirrors `httpx[brotli]`:
# maintained `brotli` (Google, prebuilt wheels incl. arm64-macOS) on CPython, `brotlicffi`
# (the maintained successor to brotlipy) on PyPy. Install via `pydantic-httpx[brotli]`.
brotli = [
    "brotli>=1.1.0; platform_python_implementation == 'CPython'",
    "brotlicffi>=1.1.0.0; platform_python_implementation != 'CPython'",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "ty>=0.0.38",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    # Integration tests hit a real public API and require internet — opt-in via -m integration.
    "-m", "not integration",
]
markers = [
    "integration: tests that hit a real API over the network (skipped by default; run with `pytest -m integration`)",
]
